<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Sign-In & Verification Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(18, 26, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: #0f172a;
      --input-border: rgba(255, 255, 255, 0.12);
      --deep-blue: #1d4ed8;
      --deep-blue-hover: #1e40af;
      --glow-blue: rgba(30, 58, 138, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-glow: rgba(59, 130, 246, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Glows */
    body::before {
      content: '';
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(30, 58, 138, 0.35) 0%, rgba(11, 15, 25, 0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -10%;
      right: 10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(29, 78, 216, 0.15) 0%, rgba(11, 15, 25, 0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    .main-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(30, 58, 138, 0.3);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 20px;
      color: #60a5fa;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .brand-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background-color: #3b82f6;
      border-radius: 50%;
      box-shadow: 0 0 8px #3b82f6;
    }

    .brand-header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 30px rgba(30, 58, 138, 0.1);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 520px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label svg {
      color: #60a5fa;
    }

    input[type="text"],
    input[type="tel"] {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 12px 16px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: all 0.25s ease;
    }

    input[type="text"]::placeholder,
    input[type="tel"]::placeholder {
      color: #475569;
    }

    input[type="text"]:focus,
    input[type="tel"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      background-color: rgba(15, 23, 42, 0.9);
    }

    /* Custom Upload Dropzone */
    .upload-zone {
      border: 2px dashed var(--input-border);
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: #3b82f6;
      background: var(--accent-glow);
    }

    .upload-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .upload-icon {
      width: 44px;
      height: 44px;
      background: rgba(30, 58, 138, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #60a5fa;
      transition: transform 0.2s ease;
    }

    .upload-zone:hover .upload-icon {
      transform: translateY(-2px);
    }

    .upload-text {
      font-size: 13px;
      color: #cbd5e1;
    }

    .upload-text span {
      color: #60a5fa;
      font-weight: 600;
    }

    .upload-subtext {
      font-size: 11px;
      color: #64748b;
    }

    input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* Image Preview */
    .preview-container {
      display: none;
      position: relative;
      margin-top: 10px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--input-border);
      max-height: 180px;
    }

    .preview-container img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(11, 15, 25, 0.8);
      color: #f8fafc;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background 0.2s;
    }

    .remove-btn:hover {
      background: #ef4444;
    }

    /* Submit Button */
    .submit-btn {
      margin-top: 10px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      box-shadow: 0 6px 20px rgba(29, 78, 216, 0.6);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* Footer Verification Link */
    .verify-footer {
      margin-top: 24px;
      text-align: center;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 13px;
      color: var(--text-muted);
    }

    .verify-link {
      color: #60a5fa;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 6px;
      transition: all 0.2s ease;
    }

    .verify-link:hover {
      color: #93c5fd;
      text-decoration: underline;
    }

    .verify-link svg {
      transition: transform 0.2s ease;
    }

    .verify-link:hover svg {
      transform: translateX(3px);
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    
    <div class="brand-header">
      <div class="brand-badge">Driver Onboarding Portal</div>
      <h1>Sign-In Details</h1>
      <p>Enter your profile & vehicle information to access the network</p>
    </div>

    <div class="form-card">
      <form action="drivers-verify.html" method="POST" enctype="multipart/form-data">
        <div class="form-grid">
          
          <!-- Full Name -->
          <div class="form-group">
            <label for="fullName">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
              Full Name
            </label>
            <input type="text" id="fullName" name="fullName" placeholder="e.g. Alexander Pierce" required>
          </div>

          <!-- Phone Number & License Number Row -->
          <div class="form-row">
            <div class="form-group">
              <label for="phoneNumber">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                Phone Number
              </label>
              <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="+1 (555) 019-2834" required>
            </div>

            <div class="form-group">
              <label for="driverLicense">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 012-2h2a2 2 0 012 2v1m-6 0h6"></path></svg>
                Driver's License No.
              </label>
              <input type="text" id="driverLicense" name="driverLicense" placeholder="DL-88392019" required>
            </div>
          </div>

          <!-- Vehicle Model/Year & Plate Number Row -->
          <div class="form-row">
            <div class="form-group">
              <label for="vehicleModelYear">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 17a2 2 0 100 4 2 2 0 000-4zm8 0a2 2 0 100 4 2 2 0 000-4zM3 9l2.286-6.857A2 2 0 017.182 1h9.636a2 2 0 011.896 1.143L21 9m-18 0h18M3 9v8a2 2 0 002 2h1a2 2 0 002-2v-1h8v1a2 2 0 002 2h1a2 2 0 002-2V9"></path></svg>
                Vehicle Model & Year
              </label>
              <input type="text" id="vehicleModelYear" name="vehicleModelYear" placeholder="Tesla Model 3 (2023)" required>
            </div>

            <div class="form-group">
              <label for="vehiclePlate">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"></path></svg>
                Vehicle Plate No.
              </label>
              <input type="text" id="vehiclePlate" name="vehiclePlate" placeholder="7XYZ890" required>
            </div>
          </div>

          <!-- Vehicle Picture Upload Field -->
          <div class="form-group">
            <label>
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              Vehicle Photo
            </label>
            
            <div class="upload-zone" id="dropZone">
              <input type="file" id="vehiclePhoto" name="vehiclePhoto" accept="image/*" required>
              <div class="upload-content" id="uploadPrompt">
                <div class="upload-icon">
                  <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                </div>
                <div class="upload-text"><span>Click to upload</span> or drag and drop</div>
                <div class="upload-subtext">SVG, PNG, JPG or WEBP (Max 10MB)</div>
              </div>
            </div>

            <!-- Preview Image Display -->
            <div class="preview-container" id="previewContainer">
              <img id="imagePreview" src="" alt="Vehicle Preview">
              <button type="button" class="remove-btn" id="removeImgBtn" title="Remove photo">&times;</button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="submit-btn">
            Submit Details
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </button>

        </div>
      </form>

      <!-- Verification Link Navigation -->
      <div class="verify-footer">
        Already have an account?
        <a href="drivers-signin.html" class="verify-link">
          Sign-In
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </a>
      </div>
    </div>

  </div>

  <script>
    const fileInput = document.getElementById('vehiclePhoto');
    const dropZone = document.getElementById('dropZone');
    const uploadPrompt = document.getElementById('uploadPrompt');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const removeImgBtn = document.getElementById('removeImgBtn');

    // Handle File Selection and Live Preview
    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        showPreview(file);
      }
    });

    function showPreview(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        imagePreview.src = e.target.result;
        previewContainer.style.display = 'block';
        dropZone.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    // Remove Selected File
    removeImgBtn.addEventListener('click', function() {
      fileInput.value = '';
      imagePreview.src = '';
      previewContainer.style.display = 'none';
      dropZone.style.display = 'block';
    });

    // Drag and Drop Visual Effects
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });
  </script>

</body>
</html>
