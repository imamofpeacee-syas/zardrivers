<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Sign In</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container Card */
    .login-card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.875rem;
      color: #9ca3af;
    }

    /* Form Styling */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #e5e7eb;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background-color: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .form-group input::placeholder {
      color: #6b7280;
    }

    /* Sign In Link / Button */
    .btn-submit {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 28px;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    /* Footer Note */
    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="header">
      <h1>Driver Portal</h1>
      <p>Sign in using your full name and driver's license number</p>
    </div>

    <form id="loginForm">
      <!-- Full Name Field -->
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          placeholder="e.g. John Doe" 
          required 
        />
      </div>

      <!-- Driver's License Field -->
      <div class="form-group">
        <label for="licenseNumber">Driver's License Number</label>
        <input 
          type="text" 
          id="licenseNumber" 
          name="licenseNumber" 
          placeholder="e.g. DL-987654321" 
          required 
        />
      </div>

      <!-- Sign In Link pointing to Dashboard -->
      <a href="final.html" class="btn-submit">
        Sign In
      </a>
    </form>

    <div class="footer-text">
      Secure Driver Authentication • Theme `#0b0f19`
    </div>
  </div>

</body>
</html>
